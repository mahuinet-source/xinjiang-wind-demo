<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xinjiang Wind Field - 3D Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            max-width: 300px;
        }
        #info h1 { font-size: 18px; margin-bottom: 10px; }
        #info p { font-size: 12px; color: #aaa; line-height: 1.5; }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
        }
        #controls label { display: block; font-size: 12px; margin: 8px 0; }
        #controls input[type="range"] { width: 150px; }
        #legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
        }
        #legend h3 { font-size: 12px; margin-bottom: 10px; }
        .legend-bar {
            width: 30px;
            height: 150px;
            background: linear-gradient(to top, #1a9850, #91cf60, #d9efc0, #fee08b, #fc8d59, #d73027);
            border-radius: 3px;
            float: left;
            margin-right: 8px;
        }
        .legend-labels {
            font-size: 11px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 150px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="loading">Loading wind data...</div>
    
    <div id="info">
        <h1>🌬️ Xinjiang Wind Field</h1>
        <p>3D visualization of wind speed across Xinjiang region</p>
        <p style="margin-top:10px;"><b>Controls:</b><br>
        • Drag to rotate<br>
        • Scroll to zoom<br>
        • Right-click to pan</p>
    </div>
    
    <div id="controls">
        <label>Wind Scale: <span id="scaleVal">1.0</span></label>
        <input type="range" id="windScale" min="0.5" max="3" step="0.1" value="1">
        <label style="margin-top:15px;">Point Size: <span id="sizeVal">3</span></label>
        <input type="range" id="pointSize" min="1" max="10" step="0.5" value="3">
    </div>
    
    <div id="legend">
        <h3>Wind Speed (m/s)</h3>
        <div class="legend-bar"></div>
        <div class="legend-labels">
            <span>15+</span>
            <span>12</span>
            <span>9</span>
            <span>6</span>
            <span>3</span>
            <span>0</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Three.js setup
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(85, 42, 80);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        // Orbit controls (simplified)
        let isDragging = false, prevX = 0, prevY = 0;
        let rotX = 0, rotY = 0;
        
        container.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
        container.addEventListener('mouseup', () => isDragging = false);
        container.addEventListener('mouseleave', () => isDragging = false);
        container.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const dx = e.clientX - prevX;
            const dy = e.clientY - prevY;
            rotY += dx * 0.01;
            rotX += dy * 0.01;
            prevX = e.clientX;
            prevY = e.clientY;
            updateCamera();
        });
        container.addEventListener('wheel', e => {
            camera.position.z = Math.max(30, Math.min(200, camera.position.z + e.deltaY * 0.1));
        });
        
        function updateCamera() {
            camera.position.x = 85 + Math.sin(rotY) * 80;
            camera.position.y = 42 + Math.sin(rotX) * 40;
            camera.lookAt(85, 42, 0);
        }
        
        // Color function
        function getColor(speed) {
            const colors = [
                [0x1a9850, 0], [0x91cf60, 3], [0xd9efc0, 6],
                [0xfee08b, 9], [0xfc8d59, 12], [0xd73027, 15]
            ];
            for (let i = 1; i < colors.length; i++) {
                if (speed <= colors[i][1]) {
                    const t = (speed - colors[i-1][1]) / (colors[i][1] - colors[i-1][1]);
                    return new THREE.Color(colors[i-1][0]).lerp(new THREE.Color(colors[i][0], t);
                }
            }
            return new THREE.Color(0xd73027);
        }
        
        // Load data and create points
        fetch('wind_data_3d.json')
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                
                const points = [];
                data.forEach(d => {
                    const geo = new THREE.SphereGeometry(0.5, 8, 8);
                    const mat = new THREE.MeshBasicMaterial({ 
                        color: getColor(d.speed),
                        transparent: true,
                        opacity: 0.8
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(d.lon, d.lat, d.speed * 0.3);
                    points.push(mesh);
                    scene.add(mesh);
                });
                
                // Arrows (glyphs)
                const arrowGroup = new THREE.Group();
                data.filter((_, i) => i % 4 === 0).forEach(d => {
                    const dir = new THREE.Vector3(d.u * 0.1, d.v * 0.1, 0).normalize();
                    const len = d.speed * 0.15;
                    
                    const arrow = new THREE.ArrowHelper(dir, 
                        new THREE.Vector3(d.lon, d.lat, d.speed * 0.3 + 0.5), len, getColor(d.speed), 0.5, 0.2);
                    arrowGroup.add(arrow);
                });
                scene.add(arrowGroup);
                
                // Ground plane
                const groundGeo = new THREE.PlaneGeometry(30, 20);
                const groundMat = new THREE.MeshBasicMaterial({ 
                    color: 0x1a1a2e, 
                    transparent: true, 
                    opacity: 0.5,
                    wireframe: true
                });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.position.set(85, 42, -5);
                scene.add(ground);
                
                // Store refs for controls
                window.points = points;
                window.arrowGroup = arrowGroup;
            })
            .catch(err => {
                document.getElementById('loading').textContent = 'Error: ' + err.message;
            });
        
        // Controls
        document.getElementById('windScale').addEventListener('input', e => {
            document.getElementById('scaleVal').textContent = e.target.value;
            const scale = parseFloat(e.target.value);
            if (window.points) {
                window.points.forEach((p, i) => {
                    p.position.z = p.userData.speed * 0.3 * scale;
                });
            }
        });
        
        document.getElementById('pointSize').addEventListener('input', e => {
            document.getElementById('sizeVal').textContent = e.target.value;
            const size = parseFloat(e.target.value) * 0.15;
            if (window.points) {
                window.points.forEach(p => {
                    p.geometry.dispose();
                    p.geometry = new THREE.SphereGeometry(size, 8, 8);
                });
            }
        });
        
        // Animate
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
        
        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
