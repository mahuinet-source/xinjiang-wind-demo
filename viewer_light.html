<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xinjiang Wind - Light</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px 20px;
            text-align: center;
        }
        .header h1 { font-size: 18px; }
        .header p { font-size: 12px; opacity: 0.9; }
        #map { 
            width: 100vw; 
            height: 70vh;
            background: #e8e8e8;
        }
        .controls {
            padding: 15px;
            background: white;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .legend {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .legend-bar {
            width: 150px;
            height: 20px;
            background: linear-gradient(to right, #1a9850, #91cf60, #d9efc0, #fee08b, #fc8d59, #d73027);
            border-radius: 3px;
        }
        .legend span { font-size: 11px; }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
        #map { position: relative; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌬️ Xinjiang Wind Speed Map</h1>
        <p>Lightweight version - works on all devices</p>
    </div>
    <div id="map">
        <div class="loading" id="loading">Loading data...</div>
    </div>
    <div class="controls">
        <div class="legend">
            <span>0</span>
            <div class="legend-bar"></div>
            <span>15+ m/s</span>
        </div>
    </div>
    
    <script>
    // Map boundaries (Xinjiang)
    const MAP = {
        latMin: 35, latMax: 50,
        lonMin: 73, lonMax: 97
    };
    
    // Color function
    function speedToColor(speed) {
        const colors = [
            [0, '#1a9850'],      // green
            [3, '#91cf60'],     // light green
            [6, '#d9efc0'],     // pale green
            [9, '#fee08b'],     // yellow
            [12, '#fc8d59'],   // orange
            [15, '#d73027']     // red
        ];
        for (let i = 1; i < colors.length; i++) {
            if (speed <= colors[i][0]) {
                const t = (speed - colors[i-1][0]) / (colors[i][0] - colors[i-1][0]);
                return interpolateColor(colors[i-1][1], colors[i][1], t);
            }
        }
        return colors[colors.length-1][1];
    }
    
    function interpolateColor(c1, c2, t) {
        const r1 = parseInt(c1.slice(1,3), 16);
        const g1 = parseInt(c1.slice(3,5), 16);
        const b1 = parseInt(c1.slice(5,7), 16);
        const r2 = parseInt(c2.slice(1,3), 16);
        const g2 = parseInt(c2.slice(3,5), 16);
        const b2 = parseInt(c2.slice(5,7), 16);
        const r = Math.round(r1 + (r2-r1)*t);
        const g = Math.round(g1 + (g2-g1)*t);
        const b = Math.round(b1 + (b2-b1)*t);
        return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
    }
    
    function drawMap(data) {
        const canvas = document.createElement('canvas');
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        const map = document.getElementById('map');
        map.innerHTML = '';
        map.appendChild(canvas);
        
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = map.clientWidth * dpr;
        canvas.height = map.clientHeight * dpr;
        ctx.scale(dpr, dpr);
        
        const w = map.clientWidth;
        const h = map.clientHeight;
        const pad = 10;
        
        // Transform coordinates
        function toX(lon) {
            return pad + (lon - MAP.lonMin) / (MAP.lonMax - MAP.lonMin) * (w - 2*pad);
        }
        function toY(lat) {
            return h - pad - (lat - MAP.latMin) / (MAP.latMax - MAP.latMin) * (h - 2*pad);
        }
        
        // Draw grid cells
        const cellW = (w - 2*pad) / 50;
        const cellH = (h - 2*pad) / 30;
        
        data.forEach(d => {
            const x = toX(d.lon);
            const y = toY(d.lat);
            const size = 3 + d.speed * 0.3;
            
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = speedToColor(d.speed);
            ctx.globalAlpha = 0.7;
            ctx.fill();
            ctx.globalAlpha = 1;
        });
        
        // Draw cities
        const cities = {
            'Urumqi': [87.62, 43.83],
            'Altay': [88.12, 47.86],
            'Kashgar': [75.99, 39.47],
            'Turpan': [89.18, 42.95]
        };
        
        ctx.font = '10px Arial';
        ctx.fillStyle = '#333';
        for (const [name, [lon, lat]] of Object.entries(cities)) {
            const x = toX(lon);
            const y = toY(lat);
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI*2);
            ctx.fillStyle = '#333';
            ctx.fill();
            ctx.fillStyle = '#666';
            ctx.fillText(name, x + 6, y + 4);
        }
        
        // Draw border (simplified)
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(toX(73), toY(35));
        ctx.lineTo(toX(97), toY(35));
        ctx.lineTo(toX(97), toY(50));
        ctx.lineTo(toX(73), toY(50));
        ctx.closePath();
        ctx.stroke();
        
        // Title
        ctx.font = 'bold 14px Arial';
        ctx.fillStyle = '#333';
        ctx.fillText('Xinjiang Wind Speed (m/s)', 15, 25);
    }
    
    // Load and draw
    fetch('wind_light.json')
        .then(r => r.json())
        .then(data => {
            document.getElementById('loading').remove();
            drawMap(data);
        })
        .catch(err => {
            document.getElementById('loading').textContent = 'Error: ' + err.message;
        });
    </script>
</body>
</html>
